[project]
name = "release-scribe"
version = "0.1.0"
description = "Genera release notes estructuradas (JSON validado) con llm-client + schema-validate."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6.0,<7",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
release-scribe = "release_scribe.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_scribe"]

[dependency-groups]
dev = ["pytest>=8,<9"]